<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>34 Brand Builder</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Build your brand for free with 34 Automation: name, logo ideas, colours, fonts, message and voice."></head><body>
<script>

window.BB_LEAD_URL = "https://formsubmit.co/ajax/nathan@34automation.co.uk";   /* webhook that receives each lead (e.g. Zapier Catch Hook) */

window.BB_BOOK_URL = "";   /* optional booking link (Calendly etc.) */

<title>34 Brand Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: black-and-gold studio frame (34 Automation), journey rail on the left,
   each step a lit "scene" with white paper cards; every step owns a vivid accent. */
:root{
  color-scheme: dark;
  --ink:#0A0A0C; --ink-2:#121216; --ink-3:#1B1B21; --line:#2A2A33; --line-2:#3A3A45;
  --text:#F3F1EA; --muted:#A4A3AD; --faint:#6D6C77;
  --paper:#FFFFFF; --paper-2:#F4F5F9; --paper-3:#E9EAF1; --on-paper:#16161C; --on-paper-2:#5B5C69; --paper-line:#DCDDE6;
  --gold-1:#F8E6A8; --gold-2:#DDAE4C; --gold-3:#9E7024;
  --gold: linear-gradient(135deg,#FBEBB5 0%,#E2B252 38%,#B9862F 62%,#F2D27E 100%);
  --violet:#7C5CFF; --coral:#FF6A55; --teal:#16C2AE; --sun:#FFC43D; --magenta:#FF4FA3; --sky:#3BA8FF; --lime:#8BD448;
  --ok:#21B26B; --warn:#F2A33A; --bad:#E5484D;
  --accent: var(--gold-2);
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 60px -30px rgba(0,0,0,.8), 0 12px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient glow behind the stage, tinted by the step accent */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(60vmax 50vmax at 85% -10%, color-mix(in srgb,var(--accent) 28%,transparent), transparent 60%),
   radial-gradient(50vmax 40vmax at -10% 110%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 60%);
  transition:background .8s}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mark{width:44px;height:44px;border-radius:8px;background:#000;border:1px solid #2b2b2b;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px -6px rgba(221,174,76,.45)}
.mark b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.04em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.mark i{display:block;font-style:normal;font-size:5.2px;letter-spacing:.18em;color:#fff;text-align:center;margin-top:2px;font-weight:700}
.top-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.top-title strong{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.top-title small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1205}
.ring{width:40px;height:40px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);display:grid;place-items:center;color:var(--text)}
.iconbtn:hover{border-color:var(--line-2)}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:64px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:240px;box-shadow:var(--shadow);z-index:70}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--text)}
.menu button:hover{background:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:2;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.rail{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:4px;perspective:600px}
.rail button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:14px;text-align:left;transition:background .2s,color .2s,transform .3s}
.rail button:hover{background:var(--ink-2);color:var(--text);transform:translateX(3px)}
.rail button[aria-current="step"]{background:var(--ink-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.orbn{--c:var(--line-2);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),radial-gradient(circle at 70% 78%,rgba(0,0,0,.35),transparent 60%),var(--c);
  box-shadow:0 6px 14px -6px var(--c)}
.rail button[data-done="true"] .orbn::after{content:"✓"}
.rail button[data-done="true"] .orbn span{display:none}
.rail .rl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.rail .rl b{font-weight:600;font-size:14px}
.rail .rl small{font-size:11.5px;color:var(--faint)}

/* ---------- stage ---------- */
main{min-width:0}
.scene{animation:sceneIn .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
@keyframes sceneIn{from{opacity:.001;transform:perspective(1200px) rotateX(6deg) translateY(24px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor;border-radius:2px}
h1.st{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.6vw,56px);line-height:1.02;letter-spacing:-.025em;margin:12px 0 10px;text-wrap:balance}
h1.st em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0 0 24px}
.why{display:flex;gap:14px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 12%,var(--ink-2));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-md);padding:14px 16px;margin:0 0 22px;max-width:860px}
.why .ico{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:#111;font-weight:800;font-size:14px}
.why p{margin:0;color:var(--text);font-size:14.5px}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
.talk{background:linear-gradient(180deg,#17140c,#100f0b);border:1px solid #4a3a17;border-radius:var(--r-md);padding:14px 18px;margin:0 0 22px;max-width:860px}
.talk b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.talk ol{margin:8px 0 0;padding-left:20px;color:#EADBB4;font-size:14.5px;display:grid;gap:4px}
body[data-mode="guided"] .facil-only{display:none!important}
body[data-mode="facilitator"] .guided-only{display:none!important}

.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.span2{grid-column:1/-1}

/* paper cards */
.paper{background:var(--paper);color:var(--on-paper);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow);min-width:0;position:relative}
.paper h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0 0 4px;color:var(--on-paper)}
.paper .sub{color:var(--on-paper-2);font-size:14px;margin:0 0 18px}
.paper.dark{background:var(--ink-2);color:var(--text);border:1px solid var(--line)}
.paper.dark h3{color:var(--text)}
.paper.dark .sub{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-weight:600;font-size:14px;color:var(--on-paper)}
.paper.dark .field label,.paper.dark .lab{color:var(--text)}
.field .hint{font-size:12.5px;color:var(--on-paper-2);margin-top:-2px}
.inp,textarea.inp,select.inp{width:100%;background:var(--paper-2);border:1.5px solid var(--paper-line);border-radius:12px;padding:11px 14px;color:var(--on-paper);transition:border-color .15s,box-shadow .15s,background .15s;min-width:0}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5;padding-right:52px}
.inp::placeholder{color:#9A9BA8}
.inp:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.big{font-family:var(--display);font-size:24px;font-weight:600;padding:14px 16px;letter-spacing:-.01em}
.paper.dark .inp{background:var(--ink-3);border-color:var(--line);color:var(--text)}
.paper.dark .inp:focus{background:var(--ink-3)}
.ta{position:relative}
.mic{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--on-paper);color:#fff;display:grid;place-items:center;transition:transform .2s}
.mic:hover{transform:scale(1.08)}
.mic.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}100%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
.count{font-size:12px;color:var(--on-paper-2);text-align:right;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14.5px;border:1.5px solid transparent;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:var(--gold);color:#1d1406;box-shadow:0 10px 24px -10px rgba(221,174,76,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold:hover{box-shadow:0 14px 30px -10px rgba(221,174,76,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.acc{background:var(--accent);color:#111}
.btn.ghost{background:transparent;border-color:var(--paper-line);color:var(--on-paper)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.dark{background:var(--on-paper);color:#fff}
.btn.line{background:transparent;border-color:var(--line-2);color:var(--text)}
.btn.line:hover{background:var(--ink-3)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--paper-line);background:var(--paper);color:var(--on-paper);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--on-paper);color:#fff;border-color:var(--on-paper)}
.chip .x{margin-left:6px;opacity:.6}
.paper.dark .chip{background:var(--ink-3);color:var(--text);border-color:var(--line)}
.tagin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper-2);border:1.5px solid var(--paper-line);border-radius:12px;padding:8px}
.tagin input{flex:1;min-width:120px;border:0;background:transparent;outline:none;padding:4px 6px;color:var(--on-paper)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--on-paper);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.tag button{border:0;background:rgba(255,255,255,.18);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1}

/* sliders */
.slider{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;align-items:center;gap:12px}
.slider span{font-size:13.5px;font-weight:600;color:var(--on-paper-2)}
.slider span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--paper-3),var(--accent));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--on-paper);box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--on-paper);cursor:grab}

/* checklist */
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--on-paper)}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* tilt cards (3D) */
.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.tiltable{perspective:900px}

/* ---------- footer nav ---------- */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navbar .mid{flex:1;text-align:center;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .mid b{color:var(--text)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;max-width:320px;margin-inline:auto}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s}

/* ---------- toast + modal ---------- */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--paper);color:var(--on-paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toastIn .3s both}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,5,8,.72);backdrop-filter:blur(6px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--paper);color:var(--on-paper);border-radius:var(--r-lg);width:min(920px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:var(--shadow);animation:sceneIn .4s both}
#modal .box h2{font-family:var(--display);font-size:22px;margin:0 0 6px}
#modal .close{float:right}

/* ---------- welcome ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;background:#050506;border:1px solid var(--line);min-height:420px;display:grid;align-items:end}
#hero3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(5,5,6,.82) 0%,rgba(5,5,6,.45) 48%,rgba(5,5,6,0) 72%)}
.hero-in{position:relative;z-index:2;padding:36px;display:grid;gap:18px;max-width:760px}
.lockup{display:flex;align-items:center;gap:16px}
.lockup .mark{width:72px;height:72px;border-radius:12px}
.lockup .mark b{font-size:31px}
.lockup .mark i{font-size:7.5px}
.lockup p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,76px);line-height:.98;letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 span{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin:0;color:#CFCDD6}
.journey{display:flex;flex-wrap:wrap;gap:8px}
.journey span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;color:#E6E4EC}
.journey i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{border:2px solid var(--paper-line);background:var(--paper-2);border-radius:18px;padding:18px;text-align:left;color:var(--on-paper);transition:all .2s}
.mode:hover{transform:translateY(-2px)}
.mode[aria-pressed="true"]{border-color:var(--on-paper);background:#fff;box-shadow:0 14px 30px -18px rgba(0,0,0,.5)}
.mode b{display:block;font-family:var(--display);font-size:16px;margin:8px 0 4px}
.mode small{color:var(--on-paper-2);font-size:13.5px}
.mode .em{font-size:24px}

/* ---------- name preview ---------- */
.namestage{background:#09090b;border-radius:var(--r-lg);min-height:300px;display:grid;place-items:center;padding:30px;position:relative;overflow:hidden;perspective:900px;border:1px solid var(--line)}
.namestage .floor{position:absolute;left:-10%;right:-10%;bottom:-40%;height:80%;background:radial-gradient(closest-side,color-mix(in srgb,var(--p,#7C5CFF) 40%,transparent),transparent);filter:blur(10px)}
.name3d{position:relative;text-align:center;transform-style:preserve-3d;transition:transform .25s}
.name3d .nm{font-size:clamp(30px,4.5vw,58px);line-height:1;color:#fff;word-break:break-word}
.name3d .tg{margin-top:14px;color:#BEBCC7;font-size:15px;letter-spacing:.06em}

/* ---------- archetypes ---------- */
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.arch button{text-align:left;border:1.5px solid var(--paper-line);background:var(--paper);border-radius:16px;padding:14px;color:var(--on-paper);transition:all .2s;min-width:0}
.arch button:hover{transform:translateY(-3px) rotateX(4deg);box-shadow:0 14px 24px -16px rgba(0,0,0,.4)}
.arch button[aria-pressed="true"]{background:var(--on-paper);color:#fff;border-color:var(--on-paper)}
.arch b{display:block;font-family:var(--display);font-size:14.5px;margin-bottom:4px}
.arch small{display:block;font-size:12.5px;opacity:.75;line-height:1.35}
.arch .ex{margin-top:6px;font-size:11.5px;opacity:.6}
.readout{display:flex;flex-wrap:wrap;gap:8px}
.readout span{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;background:var(--accent);color:#111}

/* ---------- fonts ---------- */
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ftile{position:relative;height:210px;perspective:1000px;border:0;background:transparent;padding:0;text-align:left}
.ftile .card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1)}

.ftile .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;background:var(--paper);color:var(--on-paper);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ftile .back{transform:rotateY(180deg);background:var(--paper-2)}
.ftile.sel .face{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.ftile .aa{font-size:34px;line-height:1.05;margin:auto 0 6px;word-break:break-word}
.ftile .meta{display:flex;justify-content:space-between;align-items:end;gap:8px;font-size:12px;color:var(--on-paper-2)}
.ftile .mood{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-paper-2)}
.ftile .badge{position:absolute;top:12px;right:12px;background:var(--accent);color:#111;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;z-index:3;transform:translateZ(30px)}
.ftile .back p{font-size:13.5px;line-height:1.5;margin:6px 0 0;color:var(--on-paper)}
.ftile .back h4{margin:0;font-size:20px;line-height:1.1}
.ftile .flipbtn{position:absolute;bottom:10px;right:10px;z-index:4;border:0;border-radius:8px;background:var(--paper-3);color:var(--on-paper);font-size:12px;padding:4px 8px}
@media (hover:hover){.ftile .flipbtn{display:none}}
.heart{position:absolute;top:10px;left:10px;z-index:4;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.06);color:var(--on-paper);font-size:15px;display:grid;place-items:center}
.heart[aria-pressed="true"]{background:var(--magenta);color:#fff}
.specimen{display:grid;gap:10px}
.specimen .h1{font-size:clamp(32px,4vw,52px);line-height:1.02;margin:0;word-break:break-word}
.specimen .h2{font-size:22px;margin:0}
.specimen p{margin:0;font-size:16px;line-height:1.6;max-width:60ch}

/* ---------- colours ---------- */
.orbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding:22px 6px 6px}
.orbslot{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);padding:6px;border-radius:18px;min-width:0}
.orbslot[aria-pressed="true"]{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line-2)}
.orb{--c:#888;width:min(118px,100%);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85) 0,rgba(255,255,255,.25) 14%,rgba(255,255,255,0) 34%),radial-gradient(circle at 70% 82%,rgba(0,0,0,.42),rgba(0,0,0,0) 58%),var(--c);
  box-shadow:0 26px 34px -20px var(--c),0 10px 18px -10px rgba(0,0,0,.6),inset -6px -10px 22px rgba(0,0,0,.18);animation:bob 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.orb::after{content:"";position:absolute;left:12%;right:12%;bottom:-22%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(3px);animation:shadowbob 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shadowbob{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.82) translateY(9px);opacity:.6}}
.orb.empty{background:repeating-conic-gradient(var(--ink-3) 0 25%,var(--ink-2) 0 50%) 0 0/16px 16px;box-shadow:inset 0 0 0 2px var(--line-2);animation:none;display:grid;place-items:center;font-size:28px;color:var(--muted)}
.orb.empty::after{display:none}
.orbslot .rn{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.orbslot .hx{font-family:var(--mono);font-size:13px;font-weight:600}
.orbslot .cn{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.lock{font-size:12px}
.cedit{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start}
.bigsw{width:150px;height:150px;border-radius:24px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bigsw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.bigsw span{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);color:#111;border-radius:8px;font-size:11px;padding:3px 7px;font-weight:700;pointer-events:none}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vals div{background:var(--paper-2);border-radius:10px;padding:8px 10px;min-width:0}
.vals small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-paper-2);font-weight:700}
.vals code{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.hsl{display:grid;gap:10px}
.hsl .slider{grid-template-columns:24px minmax(0,1fr) 44px}
.hsl .slider span{font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.ok{background:#DDF6E8;color:#11663D}.pill.mid{background:#FFF0D6;color:#8A5300}.pill.no{background:#FDE2E3;color:#9B1C20}
.mock{border-radius:16px;overflow:hidden;border:1px solid var(--paper-line);font-size:13px}
.mock .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.mock .mb{padding:22px 16px;display:grid;gap:10px}
.mock .mb h4{margin:0;font-size:22px;line-height:1.1}
.mock .cta{display:inline-block;padding:9px 14px;border-radius:10px;font-weight:700;width:max-content}
.ratio{display:flex;height:42px;border-radius:12px;overflow:hidden}
.presets{display:flex;flex-wrap:wrap;gap:10px}
.preset{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--paper-line);border-radius:14px;padding:8px;background:#fff;color:var(--on-paper);font-size:12.5px;font-weight:700;min-width:120px}
.preset .sw{display:flex;height:22px;border-radius:7px;overflow:hidden}
.preset .sw i{flex:1}
.preset:hover{border-color:var(--on-paper)}

/* ---------- logo studio ---------- */
.ltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ltiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ltile{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;animation:pop .5s both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:.001;transform:perspective(800px) rotateY(-25deg) scale(.92)}}
.ltile svg{display:block;width:100%;height:auto;aspect-ratio:3/2}
.ltile .lbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--paper);border-top:1px solid var(--paper-line);color:var(--on-paper)}
.ltile .lbar small{flex:1;font-size:12px;font-weight:700;color:var(--on-paper-2);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltile .lbar button{border:0;background:var(--paper-2);color:var(--on-paper);border-radius:8px;height:30px;min-width:30px;padding:0 8px;font-size:13px;font-weight:700}
.ltile .lbar button[aria-pressed="true"]{background:var(--magenta);color:#fff}
.ltile.chosen{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.ltile .open{display:block;width:100%;border:0;padding:0;background:transparent}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.favs .ltile{border-radius:12px}
.drop{border:2px dashed var(--paper-line);border-radius:16px;padding:18px;text-align:center;color:var(--on-paper-2);display:grid;gap:8px;place-items:center;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:120px;border-radius:8px}
.lpreview{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
.lpreview .big{border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--paper-line)}
.lpreview .big svg{display:block;width:100%;height:auto}
.mockups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mockups div{border-radius:12px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center;padding:10px}
.mockups svg{width:100%;height:auto}

/* ---------- avatar ---------- */
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ptabs button{border:1px solid var(--line);background:var(--ink-2);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:600}
.ptabs button[aria-pressed="true"]{background:var(--paper);color:var(--on-paper)}
.persona{position:sticky;top:96px;border-radius:24px;overflow:hidden;background:var(--paper);color:var(--on-paper);box-shadow:var(--shadow)}
.persona .top3{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#000));padding:22px;display:flex;gap:16px;align-items:center;color:#fff}
.persona .face{width:104px;height:104px;border-radius:50%;background:#fff;flex:none;overflow:hidden;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);border:4px solid rgba(255,255,255,.85)}
.persona .face svg{width:100%;height:100%;display:block}
.persona h4{font-family:var(--display);font-size:20px;margin:0;line-height:1.1;word-break:break-word}
.persona .pb{padding:18px 22px;display:grid;gap:12px;font-size:14px}
.persona .pb b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-paper-2)}
.persona q{font-family:var(--display);font-size:15px;line-height:1.35;display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--paper-line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--on-paper)}

/* competitors */
.comp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 40px;gap:10px;align-items:start}
.comp .rm{height:44px;border:0;border-radius:10px;background:var(--paper-2);color:var(--on-paper)}
.mood{columns:4 160px;column-gap:10px}
.mood figure{margin:0 0 10px;break-inside:avoid;position:relative;border-radius:12px;overflow:hidden}
.mood img{display:block;width:100%}
.mood button{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:28px;height:28px;background:rgba(0,0,0,.6);color:#fff}

/* ---------- summary board ---------- */
.board{background:#fff;color:var(--on-paper);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.board .bhead{padding:40px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:30px;align-items:center;color:#fff}
.board .bhead img{width:100%;border-radius:18px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);background:#fff}
.board .bname{font-size:clamp(34px,5vw,60px);line-height:1;margin:0;word-break:break-word}
.board .btag{font-size:18px;opacity:.85;margin-top:12px}
.board .bsec{padding:30px 40px;border-top:1px solid var(--paper-line);display:grid;gap:14px}
.board .bsec h5{margin:0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-paper-2)}
.board .bpal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.board .bpal div{display:grid;gap:6px;justify-items:center;text-align:center}
.board .bpal i{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.7),rgba(255,255,255,0) 36%),var(--c);box-shadow:0 14px 20px -12px var(--c)}
.board .bpal code{font-family:var(--mono);font-size:12.5px}
.board .bpal small{font-size:11px;color:var(--on-paper-2);text-transform:uppercase;letter-spacing:.1em}
.board .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.board p{margin:0}
.board .big{font-size:20px;line-height:1.4}
.board .vchips{display:flex;flex-wrap:wrap;gap:8px}
.board .vchips span{background:var(--paper-2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.board .empty{color:#9A9BA8;font-style:italic}
.board .bimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.board .bimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.board .bfoot{padding:18px 40px;background:#0A0A0C;color:#BDBBC5;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px}
.todo{display:grid;gap:8px}
.todo button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--ink-3);color:var(--text);border-radius:12px;padding:10px 14px;text-align:left}
.todo button span:last-child{color:var(--muted);font-size:13px}
.sub-list{display:grid;gap:10px}
.sub-list .si{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--paper-line);border-radius:14px;padding:12px 14px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .g-side{grid-template-columns:minmax(0,1fr)}
  .persona{position:relative;top:0}
  .orbs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:14px 120px}
  .rail{position:sticky;top:69px;z-index:30;flex-direction:row;overflow-x:auto;gap:6px;padding:8px 0;margin:0 -4px;background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(10px);scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail button{flex:none;padding:6px 10px 6px 6px}
  .rail button:hover{transform:none}
  .rail .rl small{display:none}
  .rail .rl b{font-size:13px}
  .g2,.g3,.lpreview,.cedit,.board .bhead,.board .cols{grid-template-columns:minmax(0,1fr)}
  .comp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .comp .rm{grid-column:1/-1;height:34px}
  .vals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-title small{display:none}
}
@media (max-width:560px){
  .seg button{padding:6px 9px;font-size:12px}
  .top-title{display:none}
  .paper{padding:18px}
  .hero-in{padding:22px}
  .modes{grid-template-columns:minmax(0,1fr)}
  .slider{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .slider input{grid-column:1/-1;grid-row:2}
  .slider span:last-child{grid-row:1;grid-column:2}
  .board .bhead,.board .bsec{padding:22px}
  .navbar .mid{display:none}
  .navbar{justify-content:space-between}
  .orbs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mockups{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){

}

function drawEls(ctx, els) {
  for (const e of els) {
    if (!e) continue;
    if (e.t === 'g') { ctx.save(); ctx.translate(e.tx, e.ty); ctx.rotate((e.rot || 0) * Math.PI / 180); ctx.scale(e.s, e.s); drawEls(ctx, e.ch); ctx.restore(); continue; }
    if (e.t === 'path') {
      const p = new Path2D(e.d); ctx.save(); if (e.op) ctx.globalAlpha = e.op;
      if (e.c && e.c !== 'none') { ctx.fillStyle = e.c; ctx.fill(p, e.fr === 'evenodd' ? 'evenodd' : 'nonzero'); }
      if (e.st) { ctx.strokeStyle = e.st; ctx.lineWidth = e.sw; ctx.lineCap = e.cap || 'butt'; ctx.lineJoin = e.join || 'miter'; ctx.stroke(p); }
      ctx.restore(); continue;
    }
    if (e.t === 'text') {
      ctx.save(); ctx.fillStyle = e.c; ctx.font = `${e.w} ${e.z}px "${e.f}", sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      if ('letterSpacing' in ctx) { ctx.letterSpacing = (e.ls || 0) + 'px'; ctx.fillText(e.s, e.x, e.y); }
      else { let x = e.x; for (const ch of e.s) { ctx.fillText(ch, x, e.y); x += ctx.measureText(ch).width + (e.ls || 0); } }
      ctx.restore();
    }
  }
}

  const ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.fillStyle = L.bg; ctx.fillRect(0, 0, L.w, L.h); drawEls(ctx, L.els); return c;
}

}

let hero = null;
/* Hero: dark field of data slabs, a glowing gold light wall streaming beams, and lit pillars (after Zajno's "Cyber Security Ecosystem") */
function startHero() {
  const cv = $('#hero3d'); if (!cv || typeof THREE === 'undefined') return;
  try {
    const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0x050506, 1);
    const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x060405, .045);
    const cam = new THREE.PerspectiveCamera(42, 1, .1, 120);
    const r = rngOf(34);

    /* lights: warm wash from the wall, faint cool fill from above */
    scene.add(new THREE.AmbientLight(0x2a2018, 1.3));
    const top = new THREE.DirectionalLight(0xb8c2d8, .7); top.position.set(-6, 10, 4); scene.add(top);
    const wallLights = [];
    [[7.6, 1.6, -2], [7.6, 1.6, -10], [7.6, 1.6, -18]].forEach(([x, y, z], i) => {
      const l = new THREE.PointLight(0xFF9A2E, 3.2 - i * .6, 16, 1.6); l.position.set(x, y, z); scene.add(l); wallLights.push(l);
    });

    /* slab field: one InstancedMesh, each tile a slightly different height */
    const COLS = 30, ROWS = 46, CELL = 1, X0 = -22, Z0 = 6;
    const slabs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x47423c, roughness: .42, metalness: .45 }), COLS * ROWS);
    const tiles = [], M = new THREE.Matrix4(), col = new THREE.Color();
    let n = 0;
    for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
      const x = X0 + i * CELL, z = Z0 - j * CELL;
      if (x > 7.2) continue;
      const big = r() < .07, h = big ? .4 + r() * .6 : .06 + r() * .26;
      const s = CELL * (r() < .25 ? .78 : .94);
      tiles.push({ x: x + CELL / 2, z: z - CELL / 2, h, s, ph: r() * 6.28, amp: r() < .14 ? .15 + r() * .3 : 0 });
      slabs.setColorAt(n, col.setHSL(.07, .08, .1 + r() * .1)); n++;
    }
    slabs.count = n; scene.add(slabs);
    const placeSlabs = t => {
      tiles.forEach((p, k) => {
        const h = p.h + (p.amp ? (Math.sin(t * .6 + p.ph) * .5 + .5) * p.amp : 0);
        M.makeScale(p.s, h, p.s); M.setPosition(p.x, h / 2, p.z); slabs.setMatrixAt(k, M);
      });
      slabs.instanceMatrix.needsUpdate = true;
    };
    placeSlabs(0);

    /* the light wall: layered streak noise moving along the wall, additive */
    const wallMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { t: { value: 0 } },
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: `uniform float t;varying vec2 vUv;
        float h(float n){return fract(sin(n)*43758.5453);}
        float layer(float rows,float speed,float seed){
          float row=floor(vUv.y*rows);float on=step(.35,h(row+seed));
          float x=vUv.x*(2.+h(row+seed*3.)*6.)+t*speed*(.4+h(row+seed*7.))+h(row)*20.;
          return on*pow(fract(x),3.+h(row+seed)*12.);}
        void main(){
          float s=layer(220.,.55,1.)*.9+layer(90.,.3,11.)*.7+layer(40.,.15,23.)*.5;
          float base=.32+.1*sin(vUv.y*40.+t*.7);
          float edge=smoothstep(0.,.08,vUv.y)*smoothstep(1.,.75,vUv.y);
          float fade=smoothstep(0.,.25,vUv.x)*smoothstep(1.,.85,vUv.x);
          float v=(s+base)*edge*fade;
          vec3 c=mix(vec3(.75,.22,.03),vec3(.89,.70,.32),clamp(v*1.4,0.,1.));
          c=mix(c,vec3(1.,.93,.75),clamp(v-.8,0.,1.));
          gl_FragColor=vec4(c*v*1.6,1.);}`
    });
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(44, 7), wallMat);
    wall.rotation.y = -Math.PI / 2; wall.position.set(8, 3.3, -14); scene.add(wall);

    /* soft glow sprite texture, reused by the floor wash and pillars */
    const gc = document.createElement('canvas'); gc.width = gc.height = 128;
    const g = gc.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,214,140,1)'); gr.addColorStop(.35, 'rgba(255,150,40,.45)'); gr.addColorStop(1, 'rgba(255,120,20,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const glowTex = new THREE.CanvasTexture(gc);
    const glowMat = o => new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: o });

    /* warm spill on the floor in front of the wall */
    const spill = new THREE.Mesh(new THREE.PlaneGeometry(10, 44),
      new THREE.MeshBasicMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: .35 }));
    spill.rotation.x = -Math.PI / 2; spill.position.set(7, .9, -14); scene.add(spill);

    /* glowing pillars in the distance */
    const pillars = [];
    [[1.2, -16], [1.9, -16.4], [-3.5, -24], [4.2, -9]].forEach(([x, z], i) => {
      const hgt = 2.4 + r() * 1.4;
      const p = new THREE.Mesh(new THREE.BoxGeometry(.12, hgt, .12), new THREE.MeshBasicMaterial({ color: 0xFFB54A }));
      p.position.set(x, hgt / 2, z); scene.add(p);
      const halo = new THREE.Sprite(glowMat(.55)); halo.scale.set(1.6, hgt * 1.5, 1); halo.position.copy(p.position); scene.add(halo);
      pillars.push({ halo, ph: i * 1.7 });
    });

    /* drifting gold dust */
    const DUST = 260, dp = new Float32Array(DUST * 3);
    for (let i = 0; i < DUST; i++) { dp[i * 3] = -14 + r() * 22; dp[i * 3 + 1] = r() * 5; dp[i * 3 + 2] = 4 - r() * 34; }
    const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
    const dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xFFC46B, size: .05, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(dust);

    let mx = 0, my = 0; const onMove = e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; };
    addEventListener('pointermove', onMove);
    let narrow = false;
    const size = () => { const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < 700 ? 58 : 42; cam.updateProjectionMatrix(); narrow = w < 700; };
    const ro = new ResizeObserver(size); ro.observe(cv); size();

    let raf = 0; const t0 = performance.now();
    const loop = () => {
      const t = (performance.now() - t0) / 1000;
      wallMat.uniforms.t.value = t;
      placeSlabs(t);
      wallLights.forEach((l, i) => { l.intensity = (3.2 - i * .6) * (.85 + .15 * Math.sin(t * 2.3 + i)); });
      pillars.forEach(p => { p.halo.material.opacity = .45 + .2 * Math.sin(t * 1.4 + p.ph); });
      dust.position.y = Math.sin(t * .2) * .2; dust.position.z = (t * .25) % 4;
      /* slow cinematic drift along the slabs towards the wall, nudged by the pointer */
      const z = 3 - (Math.sin(t * .07) * .5 + .5) * 7;
      const tx = (narrow ? -1.5 : -3) + mx * 1.2, ty = 2.5 - my * .5;
      cam.position.x += (tx - cam.position.x) * .04; cam.position.y += (ty - cam.position.y) * .04; cam.position.z = z;
      cam.lookAt(narrow ? 3 : 2.5, .3, z - 12);
      renderer.render(scene, cam);
      if (!REDUCED) raf = requestAnimationFrame(loop);
    };
    cam.position.set(narrow ? -1.5 : -3, 2.5, 3);
    loop();
    hero = { stop() { cancelAnimationFrame(raf); ro.disconnect(); removeEventListener('pointermove', onMove); glowTex.dispose(); renderer.dispose(); } };
  } catch (e) { hero = null; }
}

function nameShadow(hex) {

}

function shrinkImage(file, max = 900, q = .82) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      if (file.type === 'image/svg+xml') { res(fr.result); return; }
      const img = new Image(); img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const ctx = c.getContext('2d');
        const png = file.type === 'image/png'; if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
      }; img.onerror = () => res(''); img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function makePDF(btn) {
  if (FREE) return upsell('brand board');

    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

    await loadCurrentFonts();
    const el = $('#board'); const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }); const pw = 210, ph = 297;
    const pxPerMm = canvas.width / pw; const pagePx = Math.floor(ph * pxPerMm);
    for (let y = 0, page = 0; y < canvas.height; y += pagePx, page++) {
      const h = Math.min(pagePx, canvas.height - y); const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, h); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (page) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, pw, h / pxPerMm);
    }
    await saveFile(`${slug(brandName())}-brand-board.pdf`, pdf.output('blob'), 'application/pdf');

    const snap = await CAP.db.collection('submissions').orderBy('submittedAt', 'desc').limit(200).get();
    const list = $('#subList');
    if (snap.empty) { list.innerHTML = '<p class="sub">No submissions yet. When a client presses Submit, their worksheet appears here.</p>'; return; }
    list.innerHTML = snap.docs.map(d => { const x = d.data(); return `<div class="si"><div><b>${esc(x.company)}</b><div class="sub" style="margin:0">${esc(x.client || 'Unknown')} ${x.email ? '· ' + esc(x.email) : ''} · ${new Date(x.submittedAt).toLocaleString('en-GB')}</div></div><div class="row"><button class="btn dark sm" data-sopen="${esc(d.id)}">Open</button></div></div>`; }).join('');
    list.addEventListener('click', ev => {
      const b = ev.target.closest('[data-sopen]'); if (!b) return;
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Replace what’s on screen?'; return; }
      const doc = snap.docs.find(d => d.id === b.dataset.sopen); S = mergeDeep(defaultState(), doc.data().worksheet); save(); close(); go(11); toast('Opened ' + doc.data().company);
    });
  } catch (e) { $('#subList').innerHTML = '<p class="sub">Couldn’t load submissions right now. Try again in a moment.</p>'; }
}
/* ================= router, rail, menu, boot ================= */
let current = null;
function updateClientLine() {
  const t = S.client.business || S.name.company; $('#clientLine').textContent = t ? `Building: ${t}` : 'Designed for you by us';
}
function updateRail() {
  $$('#rail button').forEach((b, i) => { const s = STEPS[i]; b.dataset.done = !!(s.done && s.done()); });
  updateProgress();
}
function updateProgress() {
  const steps = STEPS.slice(1, 11); const n = steps.filter(s => s.done()).length; const pct = Math.round(n / steps.length * 100);
  $('#ringArc').style.strokeDashoffset = 100.5 * (1 - pct / 100); $('#ringTxt').textContent = pct + '%';
  $('#navBar').style.width = (S.meta.step / (STEPS.length - 1) * 100) + '%';
}
function buildRail() {
  $('#rail').innerHTML = STEPS.map((s, i) => `<button data-go="${i}" style="--c:${s.accent}"><span class="orbn" style="--c:${s.accent}"><span>${i || '★'}</span></span><span class="rl"><b>${s.title}</b><small>${s.short}</small></span></button>`).join('');
}
function renderStep(animate = true) {
  const i = S.meta.step; const s = STEPS[i];
  if (current && current.unmount) current.unmount();
  current = s;
  document.documentElement.style.setProperty('--accent', s.accent);
  const head = i === 0 ? '' : `<div class="eyebrow">Step ${i} of ${STEPS.length - 1} · ${s.short}</div>
    <h1 class="st">${s.id === 'summary' ? `Meet <em>${esc(brandName())}</em>.` : s.title}</h1>${s.lead ? `<p class="lead">${s.lead}</p>` : ''}${s.why ? why(s.why) : ''}${s.talk ? talk(s.talk) : ''}`;
  const stage = $('#stage');
  stage.innerHTML = `<div class="${animate ? 'scene' : ''}">${head}${s.render()}</div>`;
  hydrate(stage);
  s.mount && s.mount();
  $$('#rail button').forEach(b => b.removeAttribute('aria-current'));
  const cur = $(`#rail button[data-go="${i}"]`); cur && cur.setAttribute('aria-current', 'step');
  cur && cur.scrollIntoView({ block: 'nearest', inline: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
  $('#backBtn').disabled = i === 0;
  $('#nextBtn').textContent = i === 0 ? 'Start →' : i === STEPS.length - 1 ? 'Back to start' : `Next: ${STEPS[i + 1].title} →`;
  $('#navLabel').innerHTML = `<b>${s.title}</b> · ${i ? `${i} of ${STEPS.length - 1}` : 'Welcome'}`;
  updateRail(); updateClientLine();
}
function go(i) {
  if (rec) rec.stop();
  S.meta.step = clamp(i, 0, STEPS.length - 1); save(); renderStep();
  scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}
function setMode(m) {
  S.meta.mode = m; save(); document.body.dataset.mode = m;
  $('#modeGuided').setAttribute('aria-pressed', m === 'guided'); $('#modeFacil').setAttribute('aria-pressed', m === 'facilitator');
  $$('[data-setmode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.setmode === m));
}

/* example brand, clearly flagged */
function exampleState() {
  const x = defaultState(); x.meta.example = true; x.meta.mode = S.meta.mode;
  Object.assign(x.client, { name: 'Example: Sam Patel', business: 'Bloom & Brew', email: 'sam@example.com' });
  Object.assign(x.name, { company: 'Bloom & Brew', tagline: 'Small-batch coffee, big-hearted people', industry: 'Coffee roastery', stage: 'Launching soon', meaning: 'Coffee blooms when hot water first hits fresh grounds. It’s the moment you know it’s going to be good.', checks: { say: true, spell: true, social: true } });
  x.personality = { s: { modern: 62, playful: 70, luxury: 45, bold: 58, warm: 85, simple: 60 }, archetype: 'The Everyperson', adjectives: ['Warm', 'Crafted', 'Friendly', 'Honest'] };
  x.fonts.pair = 'friendly';
  x.colours.slots = [{ role: 'Primary', hex: '#E86A33', locked: true }, { role: 'Secondary', hex: '#3E5C76', locked: false }, { role: 'Accent', hex: '#F2C14E', locked: false }, { role: 'Dark neutral', hex: '#2B2118', locked: false }, { role: 'Light neutral', hex: '#FBF6EF', locked: false }, { role: 'Highlight', hex: '#D98BA6', locked: false }];
  x.colours.touched = true;
  x.logo.seed = 3; x.logo.styles = ['Symbol + name', 'Wordmark'];
  Object.assign(x.message, { what: 'Roast speciality coffee in small batches and post it within a week', who: 'home-workers and coffee lovers who are bored of supermarket beans', problem: 'Supermarket coffee is stale and samey', outcome: 'start every day with a cup they look forward to', different: 'every bag names the farmer and is roasted the week it ships', oneliner: 'Fresh-roasted coffee, delivered the week it’s made.' });
  x.message.pitch = 'We help home-workers who are bored of supermarket beans start every day with a cup they look forward to, by roasting speciality coffee in small batches and posting it within a week.';
  Object.assign(x.ethos, { mission: 'We exist to make brilliant coffee feel friendly, fair and fresh.', vision: 'A roastery café in every town we deliver to, with farmers we know by name.', values: [{ name: 'Craft', desc: 'We cup every batch before it ships.' }, { name: 'Fairness', desc: 'We pay above Fairtrade and publish the price.' }, { name: 'Warmth', desc: 'Every order gets a handwritten note.' }] });
  x.avatars = [{ ...newAvatar(1), name: 'Busy Becky', age: '35–44', role: 'Marketing manager, works from home', location: 'Leeds suburbs', goals: 'A calm start to the day and a small treat that feels earned', pains: 'Stale beans, confusing coffee jargon', objections: 'Worried a subscription is hard to pause', channels: ['Instagram', 'Word of mouth', 'Email'], quote: 'I just want one really good cup before the chaos starts.', look: { skin: 1, hair: 1, hairc: 2, acc: 1, bg: 0 } }];
  x.voice = { s: { casual: 75, funny: 60, irreverent: 40, enthusiastic: 70 }, pairs: [{ is: 'Warm', not: 'Gushing' }, { is: 'Knowledgeable', not: 'Snobby' }, { is: 'Playful', not: 'Silly' }], use: ['fresh', 'small-batch', 'cheers'], avoid: ['artisanal', 'synergy'], rw1: 'Your beans are on the move! Expect a knock at the door in 3–5 days.', rw2: '', signoff: 'Cheers, the Bloom & Brew crew' };
  x.insp.competitors = [{ name: 'Example Roasters Ltd', url: '', like: 'Great subscription flow', avoid: 'Feels cold and corporate' }]; x.insp.admired = ['Patagonia', 'innocent'];
  return x;
}

/* menu + global actions */
function doAct(act) {
  $('#menu').hidden = true;
  if (act === 'import') $('#importFile').click();
  if (act === 'export') exportJSON();
  if (act === 'copy') copyText(textSummary());
  if (act === 'dictation') dictationHelp();
  if (act === 'subs') showSubmissions();
  if (act === 'example') { S = exampleState(); save(); setMode(S.meta.mode); go(1); toast('Example brand loaded. Start a new worksheet to clear it.'); }
  if (act === 'reset') {
    modal(`<h2>Start a new worksheet?</h2><p class="sub">This clears everything on this device. Save your progress as a file first if you want to keep it.</p>
      <div class="row" style="margin-top:16px"><button class="btn ghost" data-close>Cancel</button><button class="btn ghost" id="rsSave">Save a copy first</button><button class="btn dark" id="rsGo">Clear and start again</button></div>`, (box, close) => {
      box.querySelector('#rsSave').onclick = () => exportJSON();
      box.querySelector('#rsGo').onclick = () => { const mode = S.meta.mode; S = defaultState(); S.meta.mode = mode; save(); close(); go(0); toast('New worksheet started'); };
    });
  }
}
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); const m = $('#menu'); m.hidden = !m.hidden; });
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('#menuBtn')) $('#menu').hidden = true;
  const a = e.target.closest('[data-act]'); if (a) { doAct(a.dataset.act); return; }
  const g = e.target.closest('[data-go]'); if (g && !e.target.closest('#modal')) { go(+g.dataset.go); return; }
  const m = e.target.closest('[data-setmode]'); if (m) setMode(m.dataset.setmode);
});
$('#modeGuided').onclick = () => setMode('guided');
$('#modeFacil').onclick = () => setMode('facilitator');
$('#backBtn').onclick = () => go(S.meta.step - 1);
$('#nextBtn').onclick = () => go(S.meta.step === STEPS.length - 1 ? 0 : S.meta.step + 1);
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data || !data.meta || !data.name) throw 0; S = mergeDeep(defaultState(), data); save(); setMode(S.meta.mode); go(STEPS.length - 1); toast('Worksheet opened'); }
  catch (err) { toast('That file isn’t a Brand Builder worksheet.'); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowRight') go(S.meta.step + 1);
  if (e.altKey && e.key === 'ArrowLeft') go(S.meta.step - 1);
});

buildRail(); setMode(S.meta.mode); renderStep(); initCaps();
</script>

</body></html>
